name: Build apps

# Push a tag like v2.0.0 to build the Windows, Linux and Android apps and attach them to a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The Android SDK is already installed on GitHub's Ubuntu machines.
      - run: npm install
      - run: npm run web:build
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#161d24' --iconBackgroundColorDark '#161d24'
      - run: npx cap sync android
      - run: ./gradlew assembleRelease
        working-directory: android
      # Sign with the same key every time so new versions install as updates
      # and keep the zines saved on the shelf.
      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          version=$(node -p "require('./package.json').version")
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_B64" | base64 -d > release.p12
          "$tools/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$tools/apksigner" sign --ks release.p12 --ks-key-alias zinesplit --ks-pass env:KEYSTORE_PASSWORD \
            --out "ZineSplit-$version-android.apk" aligned.apk
          "$tools/apksigner" verify "ZineSplit-$version-android.apk"
          rm release.p12
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ZineSplit-*-android.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package the browser version
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p "ZineSplit-$version-web"
          cp -r index.html fonts LICENSE "ZineSplit-$version-web/"
          zip -qr "ZineSplit-$version-web.zip" "ZineSplit-$version-web"
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ZineSplit-*-web.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ZineSplit ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
