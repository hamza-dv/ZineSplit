[package]
name = "zinesplit"
version = "1.1.0"
description = "Read your printed zine as a book."
authors = ["Hamza"]
license = "MIT"
repository = "https://github.com/hamza-dv/ZineSplit"
edition = "2021"

[lib]
name = "zinesplit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
